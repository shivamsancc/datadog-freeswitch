[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fs-rtp-listener"
version = "0.1.0"
description = "FreeSWITCH RTP quality listener (research prototype, not a Datadog integration)"
requires-python = ">=3.10"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["fs_rtp_listener"]

[tool.pytest.ini_options]
testpaths = ["tests"]
